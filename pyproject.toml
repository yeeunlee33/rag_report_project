[project]
name = "LLM_REPORT_PROJECT"
version = "0.1.0"
description = "report create project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain>=0,<1",
    "langchain-core>=0,<1",
    "langchain-experimental>=0,<1",      # SemanticChunker (chunking_02_semantic.py)
    "langchain-community>=0,<1",         # BM25Retriever, Chroma fallback
    "langchain-openai>=0,<1",
    "langchain-text-splitters>=0,<1",    # RecursiveCharacterTextSplitter
    "langchain-chroma>=0,<1",
    "openai>=1,<3",                      # Loader.py 가 직접 사용하는 raw client
    "cohere>=5,<6",                      # reranker_02_cohere.py 가 직접 사용 (langchain-cohere 래퍼는 미사용)
    "kiwipiepy>=0,<1",                   # retriever_01/02 형태소 분석
    # 데이터 처리 및 분석 관련 패키지
    "pandas>=2,<3",
    "numpy>=1,<3",                       # eval/03_eval_rag.py, eval/04_eval_report.py 가 직접 사용
    "rank-bm25>=0,<1",                   # BM25Retriever 내부에서 필요
    # 벡터DB
    "chromadb>=0,<1",
    # PDF 처리
    "pymupdf4llm>=0,<1",                 # Loader.py 유일한 PDF 파서
    # 웹 UI / API 서버
    "streamlit>=1,<2",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    # 리랭커
    "flashrank>=0,<1",                   # reranker_01_crossencoder.py
    # 기타 유틸리티
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "lxml>=5,<6",                        # naver_industry_crawler.py
    "requests>=2,<3",                    # naver_industry_crawler.py
    "beautifulsoup4>=4,<5",              # naver_industry_crawler.py
    "tenacity>=8,<9",                    # api/main.py 재시도 로직
    "ragas>=0.4,<0.5",                   # eval/ 파이프라인
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    # notebook/, src/processing/chunking/pp.ipynb 등 실험용 노트북 열 때만 필요
    # (앱/API 실행에는 필요 없음)
    "jupyter>=1,<2",
    "notebook>=7,<8",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"